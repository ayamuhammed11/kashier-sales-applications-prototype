<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your payout details | Kashier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css?v=20261123b">
<link rel="stylesheet" href="shared/sa.css?v=20261123b">
<link rel="icon" type="image/svg+xml" href="../img/kashier-favicon.svg">
<style>
  /* The merchant's page from the confirmation link: its own fullscreen layout, outside the agent portal. */
  body { background: var(--bg); min-height: 100vh; }
  .pc { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px 16px; }
  .pc-logo { height: 28px; }
  .pc-card { width: 100%; max-width: 480px; background: var(--white); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
  @media (min-width: 768px) { .pc-card { padding: 32px; } }
  .pc-h { display: flex; flex-direction: column; gap: 8px; }
  .pc-h h1 { font-family: var(--font-display); font-size: 25px; line-height: 1.25; margin: 0; }
  .pc-h p { margin: 0; color: var(--cadet-base); }
  .pc-otp { font-size: 20px; letter-spacing: .4em; text-align: center; font-variant-numeric: tabular-nums; }
  .pc-acts { display: flex; flex-direction: column; gap: 12px; }
  .pc-acts .btn { width: 100%; justify-content: center; min-height: 44px; }
  .pc-ok { width: 48px; height: 48px; color: var(--success); }
  .pc-foot { color: var(--cadet-base); font-size: 12px; text-align: center; max-width: 480px; }
</style>
</head>
<body>
<main class="pc">
  <img class="pc-logo" src="../img/Kashier-logo.svg" alt="Kashier">
  <section class="pc-card" id="card" aria-live="polite"></section>
  <p class="pc-foot">This page was sent to you by Kashier to confirm where your payments are settled. Kashier never asks for your card details or password.</p>
</main>
<script>
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search), APP = qs.get('app') || '', TOKEN = qs.get('t') || '';
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const nowStr = () => new Date().toLocaleString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const maskPhone = ph => { const m = String(ph || '').trim().match(/^(\+\d{1,3})?.*?(\d{4})$/); return m ? (m[1] ? m[1] + ' ' : '') + '••• ' + m[2] : String(ph || ''); };
  // Heroicons v2 outline check-circle, verbatim.
  const CHECK = '<svg class="pc-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>';

  /* The application this link belongs to, from the prototype's storage: the sales prototype's own application or a demo one. */
  function find() {
    try {
      const main = JSON.parse(localStorage.getItem('sa-dir-final') || 'null');
      if (main && main.appId === APP) return { st: main, save: s => localStorage.setItem('sa-dir-final', JSON.stringify(s)) };
      const demo = JSON.parse(localStorage.getItem('kashierUwDemoApps') || '{}');
      if (demo[APP]) return { st: demo[APP], save: s => { demo[APP] = s; localStorage.setItem('kashierUwDemoApps', JSON.stringify(demo)); } };
    } catch (e) { /* storage unavailable */ }
    return null;
  }
  const rec = find(), S = rec && rec.st, C = S && S.payoutConfirm;
  let step = 'review', otpErr = '', resent = false;
  const card = document.getElementById('card');

  const payList = () => `<div class="pm-list">${S.payouts.map((p, i) => `<div class="pm"><div class="pm-h"><b>${p.id === S.primary ? 'Primary payout method' : esc(p.name || 'Payout method ' + (i + 1))}</b><span class="tag info">${p.type === 'bank' ? 'Bank account' : 'E-wallet'}</span></div>
    <dl class="dl dl-s">${p.type === 'bank' ? `<dt>Bank</dt><dd>${esc(p.bank)}</dd><dt>Branch</dt><dd>${esc(p.branch)}</dd><dt>Account holder</dt><dd>${esc(p.holder)}</dd><dt>Account number</dt><dd dir="ltr" class="num">${esc(p.acct)}</dd>`
      : `<dt>Wallet provider</dt><dd>${esc(p.provider)}</dd><dt>Mobile number</dt><dd dir="ltr" class="num">${esc(p.mobile)}</dd><dt>Wallet holder</dt><dd>${esc(p.wholder)}</dd>`}</dl></div>`).join('')}</div>`;

  function render() {
    if (!S || !C || C.token !== TOKEN) {
      card.innerHTML = `<div class="pc-h"><h1>This link isn't valid</h1><p>It may have been replaced by a newer link. Open the latest message from Kashier, or ask your account manager to send it again.</p></div>`;
      return;
    }
    if (C.status === 'confirmed') {
      card.innerHTML = `${CHECK}<div class="pc-h"><h1>Payout details confirmed</h1><p>Thank you. ${esc(S.merchant.name)}'s payouts will be settled to the account${S.payouts.length > 1 ? 's' : ''} below. Confirmed on ${esc(C.at)}.</p></div>${payList()}`;
      return;
    }
    if (step === 'review') {
      card.innerHTML = `<div class="pc-h"><h1>Confirm your payout details</h1><p>${esc(C.sentBy || 'Your account manager')} at Kashier set up where ${esc(S.merchant.name)} gets paid. Check the details below before your account goes live.</p></div>
        ${payList()}
        <div class="pc-acts"><button type="button" class="btn btn-primary" data-send>Send me a code</button>
        <p class="hint" style="margin:0;text-align:center">We'll text a 6-digit code to ${esc(maskPhone(C.phone))}. Something wrong? Don't confirm: contact ${esc(C.sentBy || 'your account manager')}.</p></div>`;
      card.querySelector('[data-send]').onclick = () => { step = 'otp'; render(); };
      return;
    }
    card.innerHTML = `<div class="pc-h"><h1>Enter your code</h1><p>We sent a 6-digit code to ${esc(maskPhone(C.phone))}${resent ? ' again' : ''}. It confirms the payout details for ${esc(S.merchant.name)}.</p></div>
      <div class="fld"><label for="otp">Verification code</label><input class="inp pc-otp ${otpErr ? 'err' : ''}" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" aria-describedby="otpH">
        ${otpErr ? `<span class="ferr" id="otpH">${esc(otpErr)}</span>` : '<span class="hint" id="otpH">The code expires in 10 minutes.</span>'}</div>
      <div class="note"><p><b>Prototype:</b> no SMS is sent. The code is <span class="num">${esc(C.otp)}</span>.</p></div>
      <div class="pc-acts"><button type="button" class="btn btn-primary" data-ok disabled>Confirm payout details</button><button type="button" class="link-btn" style="align-self:center" data-resend>Send a new code</button><button type="button" class="link-btn" style="align-self:center" data-back>Back to the details</button></div>`;
    const inp = card.querySelector('#otp'), ok = card.querySelector('[data-ok]');
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); ok.disabled = inp.value.length !== 6; };
    inp.onkeydown = e => { if (e.key === 'Enter' && !ok.disabled) ok.click(); };
    ok.onclick = () => {
      if (inp.value !== C.otp) { otpErr = "That code isn't right. Check the SMS and try again."; render(); card.querySelector('#otp').focus(); return; }
      C.status = 'confirmed'; C.at = nowStr();
      S.log = S.log || []; S.log.unshift({ t: C.at, who: S.merchant.name, text: 'confirmed the payout details with the one-time code', ic: 'check', detail: S.payouts.map(p => p.type === 'bank' ? `${p.bank} · ${p.acct}` : `${p.provider} · ${p.mobile}`).join('; ') });
      rec.save(S); render();
    };
    card.querySelector('[data-resend]').onclick = () => { C.otp = String(Math.floor(100000 + Math.random() * 900000)); rec.save(S); resent = true; otpErr = ''; render(); card.querySelector('#otp').focus(); };
    card.querySelector('[data-back]').onclick = () => { step = 'review'; otpErr = ''; render(); };
    inp.focus();
  }
  render();
})();
</script>
</body>
</html>
