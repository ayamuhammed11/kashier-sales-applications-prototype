<script>/* The bank export files are not part of the public prototype: load them only where they exist, so the public site makes no failing requests. */
if (!/\.github\.io$/.test(location.hostname)) document.write(['nbe-defaults', 'nbe-export', 'bm-defaults', 'bm-export'].map(f => '<script src="' + f + '.js"><\/script>').join(''));</script>
<script src="uw-core.js?v=20261123g"></script>

<script src="uw-case-view.js?v=20261123g"></script>
<script>
(function () {
  const C = Cases, me = C.user(), U = UW;
  const id = new URLSearchParams(location.search).get('id');
  const USERS = { agent: 'Rana Adel \u00b7 Agent', agent2: 'Omar Hassan \u00b7 Agent', agent3: 'Salma Nabil \u00b7 Agent', manager: 'Layla Samir \u00b7 Manager' };
  SA.mount({ key: 'case', render() { const p = document.getElementById('page'); if (!U.get(id)) { p.innerHTML = `<div class="wrap"><div class="card empty" style="text-align:center;padding:48px 16px;display:flex;flex-direction:column;gap:8px;align-items:center"><h3>Case not found</h3><p class="hint">It may be assigned to another agent, or the sales application was reset.</p><a class="btn btn-outline" href="cases.html">Back to Cases</a></div></div>`; return; } CaseView.mount(p, id, {}); },
    protoControls: () => `<label class="lbl" for="role">View as</label><select id="role" data-keep>${Object.keys(USERS).map(k => `<option value="${k}" ${me.key === k ? 'selected' : ''}>${USERS[k]}</option>`).join('')}</select>`,
    bindProto() { document.getElementById('role').onchange = e => { try { localStorage.setItem('kashierCasesUser', e.target.value); } catch (x) { /* storage unavailable */ } location.reload(); }; } });
})();
</script>
