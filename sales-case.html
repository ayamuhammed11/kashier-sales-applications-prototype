<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kashier | Case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sales-applications/shared/base.css">
<link rel="stylesheet" href="sales-applications/shared/sa.css">
<link rel="stylesheet" href="components/filter-bar.css">
<style>
  .wrap { max-width: 960px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
  .hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .hdr > div:first-child { flex: 1; min-width: 0; }
  .meta { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; color: var(--cadet-base); font-size: 14px; margin-block-start: 8px; }
  .tag { font-size: 12px; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; background: var(--muted); color: var(--cadet-base); border: 1px solid var(--border); }
  .linkb { background: none; border: 0; padding: 0; color: var(--link); font-weight: 600; cursor: pointer; font: inherit; }
  .row { display: flex; align-items: flex-start; gap: 16px; padding: 16px 0; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .row .i { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
  .row .n { font-weight: 600; } .row .f { font-size: 13px; color: var(--cadet-base); overflow-wrap: anywhere; } .row .f.bad { color: var(--destructive); }
  .row .a { display: flex; gap: 8px; align-items: center; }
  .rate { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; max-width: 420px; }
  .rate b { white-space: nowrap; }
  .note { border-top: 1px solid var(--border-subtle); padding-top: 12px; } .note .k { font-size: 12px; color: var(--cadet-base); }
  .info { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 14px; }
  .info.bad { background: var(--error-10); border-color: #FFD0D6; } .info.ok { background: var(--lemon-10); border-color: var(--lemon-20); }
  .empty { text-align: center; padding: 48px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .sub { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; margin-block-start: 8px; } .sub h3 { font-size: 16px; }
  /* compact pop-ups */
  .modal { max-width: 420px; } .modal .mh { padding: 16px 20px 4px; } .modal h2 { font-size: 18px; } .modal .mb { padding: 4px 20px 8px; gap: 8px; } .modal .mf { padding: 8px 20px 16px; } .modal textarea.inp { min-height: 64px; } .modal .hint { font-size: 12px; }
  .files { display: flex; flex-direction: column; gap: 8px; margin-block-start: 6px; } .fitem { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; } .fitem .fnm { font-size: 13px; color: var(--cadet-base); overflow-wrap: anywhere; flex: 1; min-width: 140px; }
  .rg { border-top: 1px solid var(--border-subtle); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; } .rg h3 { font-size: 16px; } .rg p { margin: 0; font-size: 13px; color: var(--cadet-base); }
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; } .fgrid .wide { grid-column: 1 / -1; } @media (max-width: 640px) { .fgrid { grid-template-columns: 1fr; } }
  .bv { min-height: 40px; display: flex; align-items: center; padding: 0 12px; background: var(--muted); border-radius: var(--radius); overflow-wrap: anywhere; } .inp.bad { border-color: var(--destructive); }
  .phases { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; list-style: none; margin: 0; padding: 0; } @media (max-width: 640px) { .phases { grid-template-columns: 1fr; } }
  .phases li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); }
  .phases .d { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; background: var(--muted); color: var(--cadet-base); border: 1px solid var(--border); }
  .phases b { display: block; } .phases span.s { display: block; font-size: 13px; color: var(--cadet-base); } .phases em { display: block; font-style: normal; font-size: 13px; font-weight: 600; margin-block-start: 4px; }
  .phases .now { border-color: var(--ocean-20); background: var(--primary-10); } .phases .now .d { background: var(--primary); color: var(--white); border-color: var(--primary); } .phases .now em { color: var(--link); }
  .phases .done { border-color: var(--lemon-20); } .phases .done .d { background: var(--lemon-10); color: var(--lemon-80); border-color: var(--lemon-20); } .phases .done em { color: var(--lemon-80); }
  .phases .bad { border-color: #FFD0D6; background: #fffafb; } .phases .bad .d { background: var(--error-10); color: var(--destructive); border-color: #FFD0D6; } .phases .bad em { color: var(--destructive); }
  .phases .later { background: var(--muted); border-style: dashed; } .phases .later b, .phases .later span.s, .phases .later em { color: var(--cadet-base); }
  .gh { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-block-start: 8px; } .gh h3 { margin: 0 !important; }
  .sgrp { display: flex; flex-direction: column; } .sgrp + .sgrp { margin-block-start: 8px; } .sgrp h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--cadet-base); margin: 8px 0 0; }
  .chips { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
  .row.chg { flex-direction: column; gap: 12px; align-items: stretch; } .ch { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .row.web { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 16px; } .row.web .wo { justify-self: end; display: flex; gap: 8px; } .row.web .a { justify-self: end; } .row.web .wu { display: flex; align-items: center; gap: 8px 12px; min-width: 0; } .row.web .fnm { font-size: 13px; color: var(--cadet-base); overflow-wrap: anywhere; } .row.web .wfull { grid-column: 1 / -1; }
  .btn.lnk { padding-inline: 10px; gap: 4px; }
  .row.chg .rscroll { max-width: 100%; }
  .cmp.one { grid-template-columns: 1fr !important; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 640px) { .cmp { grid-template-columns: 1fr; } }
  .cc { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; } .cc.new { border-color: var(--ocean-20); background: var(--primary-10); }
  .cc .k { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--cadet-base); font-weight: 600; } .cc .none { color: var(--cadet-base); }
  .cc dl { margin: 0; display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 12px; font-size: 14px; } .cc dt { color: var(--cadet-base); } .cc dd { margin: 0; overflow-wrap: anywhere; } .cc dd.chg { font-weight: 700; }
  .ptitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex: 1; }
</style>
</head>
<body>
<script src="components/filter-bar.js"></script>
<script src="sales-applications/shared/agent-icons.js"></script>
<script src="sales-applications/shared/sa-core.js"></script>
<script src="rate-decisions.js"></script>
<script src="cases-core.js"></script>
<script src="uw-core.js"></script>
<script>
/* One case page for both kinds of case, kept simple: the case info, then one block per part. A service case has two phases (review,
   then bank preparation); only the review is built, the bank preparation is postponed (UW.PHASE2).
   A case is always one service (or one change request): it never merges in other cases of the application.
   Phase 1 of a service case:
   A service case is the service's pricing, its own documents and its contract. An application details case is a change to the
   merchant's business details or payout methods. A page shows either, or both when the application has both in review. */
(function () {
  const { icon, esc } = SA, C = Cases, U = UW;
  const id = new URLSearchParams(location.search).get('id');
  const me = C.user();
  const CHIP = { 'Waiting Rate Approval': 'warn', 'Underwriting Review': 'info', 'Bank Submission': 'ok2', Rejected: 'bad', Canceled: 'neu', Live: 'ok', Approved: 'ok' };
  const sc = s => `<span class="sc ${CHIP[s] || 'neu'}">${esc(U.STATUS[s] ? U.STATUS[s].label : s)}</span>`;
  const tierName = k => k === 'local' ? 'Local rates' : k.indexOf('intl-') === 0 ? 'International · ' + k.slice(5) : k.replace(/-/g, ' ');
  const dl = rows => `<dl class="dl">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v && v.html ? v.html : v == null || v === '' ? '—' : esc(v)}</dd>`).join('')}</dl>`;
  const links = list => list && list.length ? { html: list.map(u => `<a class="linkb" href="${esc(/^https?:\/\//i.test(u) ? u : 'https://' + u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`).join(', ') } : '';
  const profile = `<button type="button" class="profile" aria-label="Account: ${esc(me.name)}"><span class="pav">${esc(me.initials)}</span><span class="pdata"><span class="pname">${esc(me.name)}</span><span class="pmail">${esc(me.label)}</span></span>${icon('chevron', 'ic-16')}</button>`;
  const crumb = last => `<nav class="crumb" aria-label="Breadcrumb"><a href="cases.html">Cases</a><svg class="ic-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${AGENT_ICONS['chevron-right']}</svg><span aria-current="page">${esc(last)}</span></nav>`;
  const go = msg => { location.href = 'cases.html'; try { sessionStorage.setItem('cases-toast', msg); } catch (e) { /* storage unavailable */ } };

  /* The service as the application records it, then every rate type: what was requested, what is published, and its approval. */
  function mirror(c) { const S = SA.S; S.svc = S.svc || {}; S.svc[c.sid] = Object.assign({ ops: [], notes: '', currencies: ['EGP'] }, c.svc); S.entity = c.entity; S.industry = c.industry; S.activities = [c.industry]; S.owner = ''; }
  function pricingDetail(c) {
    mirror(c);
    const sid = c.sid, svc = SA.S.svc[sid], nm = sid.slice(sid.indexOf(' ') + 1), banks = [...new Set((svc.lines || []).map(l => l.bank).filter(Boolean))];
    const cur = svc.model === 'PF' ? ['EGP'] : (svc.currencies || ['EGP']);
    const rows = [['Service', nm + (SA.SVC_HINT[nm] ? ' · ' + SA.SVC_HINT[nm] : '')], ['Channel', c.channel], ['Model', svc.model + ' - ' + c.channel]];
    if (SA.needsBank(sid)) rows.push(['Financial institution', banks.length ? banks.join(', ') : 'Not chosen']);
    if (c.channel === 'POS') rows.push(['POS terminals', c.terminals || 'Not set']);
    if (SA.isCard(sid)) rows.push(['Currencies and operations', cur.join(', ') + ' · ' + (svc.ops.length ? svc.ops.join(', ') : 'No advanced operations')]);
    if (svc.notes && svc.notes.trim()) rows.push(['Notes', svc.notes]);
    if (c.submitComment) rows.push(['Submit comment', c.submitComment]);
    const body = (svc.lines || []).map(l => SA.tiersFor(sid, l).map(t => {
      const sel = l.rates[t.key] || {}, v = SA.verdict(sid, l, t), has = sel.rate !== undefined && sel.rate !== '';
      const appr = !has ? '<span class="f">Not entered</span>' : v.tier === 'auto' ? '<span class="f">No approval needed</span>' : `<span class="sc ok">Approved</span> <span class="f">${v.tier === 'head' ? 'Head of Sales' : 'Sales Manager'}</span>`;
      return `<tr><td>${l.bank ? `<div class="f">${esc(l.bank)}</div>` : ''}${esc(t.label)}</td><td class="num"><b>${has ? esc(SA.rateText(sel)) : '\u2014'}</b></td><td class="num">${esc(SA.pubText(v.p))}</td><td>${appr}</td></tr>`;
    }).join('')).join('');
    return `<dl class="dl">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      <div class="rscroll" style="display:block"><table class="rtbl ro-svc"><thead><tr><th>Rate type</th><th>Requested</th><th>Published</th><th>Approval</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function rates(c) {
    const lines = c.svc.lines || [];
    if (!lines.length) return '<span class="f">No rates were entered for this service.</span>';
    return lines.map(l => `<div><b>${esc(l.bank || 'No bank')}</b> <span class="f">${esc(c.model)} · ${esc(c.channel)}</span>${Object.keys(l.rates || {}).map(k => `<div class="rate"><span>${esc(tierName(k))}</span><b>${esc(l.rates[k].rate)}% + ${esc(l.rates[k].fee)} EGP</b></div>`).join('')}</div>`).join('');
  }
  /* The decision sits with the item it belongs to. */
  function decision(x, c) {
    const open = c.status === 'Underwriting Review', d = `data-case="${esc(c.id)}"`;
    if (x.missing) return '<span class="sc bad">Rejected</span>';
    if (x.state === 'ok' || x.state === 'flag') return `<span class="sc ${x.state === 'ok' ? 'ok' : 'bad'}">${x.state === 'ok' ? 'Approved' : 'Rejected'}</span>${open ? `<button class="linkb" type="button" ${d} data-clear="${esc(x.key)}">Undo</button>` : ''}`;
    return open ? `<button class="btn btn-outline-danger btn-sm" type="button" ${d} data-flag="${esc(x.key)}" data-lbl="${esc(x.label)}">Reject</button><button class="btn btn-primary btn-sm" type="button" ${d} data-ok="${esc(x.key)}">Approve</button>` : '';
  }
  /* A payout method is written as "Bank account · bank · branch · holder · account" or "E-wallet · provider · mobile · holder" (optionally "name: " first). Shown in full, field by field. */
  function parsePay(s) {
    if (!s || s === 'None') return null;
    let name = ''; const m = String(s).match(/^(.*?): (Bank account|E-wallet) · /);
    if (m) { name = m[1]; s = s.slice(m[1].length + 2); }
    const p = String(s).split(' · '), o = {};
    if (name) o['Name'] = name;
    if (p[0] === 'Bank account') { o['Type'] = 'Bank account'; o['Bank name'] = p[1]; o['Branch'] = p[2]; o['Account holder'] = p[3]; o['Account number'] = p[4]; }
    else { o['Type'] = 'E-wallet'; o['Provider'] = p[1]; o['Mobile number'] = p[2]; o['Account holder'] = p[3]; }
    return o;
  }
  const isPay = l => /^(Payout method|Primary payout)/.test(l);
  /* Old and new side by side. Fields that changed are bold on the new side. */
  /* A new application has nothing earlier to compare with: just what was submitted, a payout method in full. */
  function submitted(x) {
    const o = isPay(x.label) ? parsePay(x.to) : null;
    return `<div class="cmp one"><div class="cc new"><span class="k">Submitted</span>${o ? `<dl>${Object.keys(o).map(k => `<dt>${esc(k)}</dt><dd>${esc(o[k] == null ? '\u2014' : o[k])}</dd>`).join('')}</dl>` : `<span>${esc(x.to)}</span>`}</div></div>`;
  }
  function compare(x) {
    if (x.isNew) return submitted(x);
    const a = isPay(x.label) ? parsePay(x.from) : null, b = isPay(x.label) ? parsePay(x.to) : null;
    const side = (cls, title, obj, raw, other) => `<div class="cc ${cls}"><span class="k">${title}</span>${isPay(x.label) ? (obj ? `<dl>${Object.keys(obj).map(k => `<dt>${esc(k)}</dt><dd class="${cls === 'new' && (!other || other[k] !== obj[k]) ? 'chg' : ''}">${esc(obj[k] == null ? '—' : obj[k])}</dd>`).join('')}</dl>` : '<span class="none">None</span>') : `<span class="${cls === 'new' ? '' : 'none'}" style="${cls === 'new' ? 'font-weight:700' : ''}">${esc(raw)}</span>`}</div>`;
    return `<div class="cmp">${side('old', 'Current', a, x.from, null)}${side('new', 'Requested', b, x.to, a)}</div>`;
  }
  const platform = u => { const h = String(u).toLowerCase(); return /facebook|fb\.com/.test(h) ? 'Facebook' : /instagram/.test(h) ? 'Instagram' : /(^|[./])x\.com|twitter/.test(h) ? 'X' : /linkedin/.test(h) ? 'LinkedIn' : /tiktok/.test(h) ? 'TikTok' : /youtube|youtu\.be/.test(h) ? 'YouTube' : 'Website'; };
  function row(x, c) {
    if (x.key === 'pricing') {
      return `<div class="row chg"><div class="ch"><span class="n">${esc(x.label)}</span><div class="a">${decision(x, c)}</div></div>${pricingDetail(c)}${x.state === 'flag' ? `<span class="f bad">${esc(x.reason)}</span>` : ''}</div>`;
    }
    if (x.links && x.links.length) {
      return `<div class="row web"><div class="wn"><span class="n">${esc(x.label)}</span></div><div class="a">${decision(x, c)}</div>${x.links.map(u => `<div class="wu"><span class="tag">${platform(u)}</span><span class="fnm">${esc(u)}</span></div><div class="wo"><a class="btn btn-outline btn-sm lnk" href="${esc(/^https?:\/\//i.test(u) ? u : 'https://' + u)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(u)} in a new tab">Open${icon('ext', 'ic')}</a></div>`).join('')}${x.state === 'flag' ? `<span class="f bad wfull">${esc(x.reason)}</span>` : ''}</div>`;
    }
    if (x.list && x.list.length) {
      // Files: View and Download sit in the right-hand column, right under Reject / Approve.
      return `<div class="row web"><div class="wn"><span class="n">${esc(x.label)}</span></div><div class="a">${decision(x, c)}</div>${x.list.map(f => `<div class="wu"><span class="fnm">${esc(f)}</span></div><div class="wo"><button class="btn btn-outline btn-sm" type="button" data-view="${esc(f)}" data-l="${esc(x.label)}">${icon('eye', 'ic')}View</button><button class="btn btn-outline btn-sm" type="button" data-dl="${esc(f)}">${icon('download', 'ic')}Download</button></div>`).join('')}${x.state === 'flag' ? `<span class="f bad wfull">${esc(x.reason)}</span>` : ''}</div>`;
    }
    if (x.from != null || x.isNew) {
      return `<div class="row chg"><div class="ch"><span class="n">${esc(x.label)}</span><div class="a">${decision(x, c)}</div></div>${compare(x)}${x.state === 'flag' ? `<span class="f bad">${esc(x.reason)}</span>` : ''}</div>`;
    }
    const detail = x.from != null ? `${esc(x.from)} &rarr; <b>${esc(x.to)}</b>` : x.key === 'pricing' ? pricingDetail(c) : x.files && x.files.length ? esc(x.files.join(' · ')) : '';
    const fl = (x.list || []).map(f => `<div class="fitem"><span class="fnm">${esc(f)}</span><button class="btn btn-outline btn-sm" type="button" data-view="${esc(f)}" data-l="${esc(x.label)}">${icon('eye', 'ic')}View</button><button class="btn btn-outline btn-sm" type="button" data-dl="${esc(f)}">${icon('download', 'ic')}Download</button></div>`).join('');
    const ll = (x.links || []).map(u => `<div class="fitem"><span class="tag">${platform(u)}</span><span class="fnm">${esc(u)}</span><a class="btn btn-outline btn-sm" href="${esc(/^https?:\/\//i.test(u) ? u : 'https://' + u)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(u)} in a new tab">${icon('ext', 'ic')}Open link</a></div>`).join('');
    return `<div class="row"><div class="i"><span class="n">${esc(x.label)}</span>${fl || ll ? `<div class="files">${fl}${ll}</div>` : detail ? `<span class="f">${detail}</span>` : ''}${x.state === 'flag' ? `<span class="f bad">${esc(x.reason)}</span>` : ''}</div><div class="a">${decision(x, c)}</div></div>`;
  }
  const nFiles = p => p.list.reduce((n, x) => n + (x.list ? x.list.length : 0), 0);
  /* One block per case: the title, its status, and the items to decide. */
  function part(c, nested) {
    const p = U.progress(c), open = c.status === 'Underwriting Review', app = c.type === 'application';
    const note = c.status === 'Rejected' && c.reject ? `<div class="info bad"><b>Rejected${c.reject.by ? ' by ' + esc(c.reject.by) : ''}.</b> ${esc(c.reject.comment || '')} The salesperson fixes it on the application and resubmits.</div>`
      : c.status === 'Approved' ? `<div class="info ok"><b>Approved${c.decision ? ' by ' + esc(c.decision.by) : ''}.</b> The changes are now on the application.</div>`
      : c.status === 'Bank Submission' && !app ? `<div class="info ok"><b>Case review complete.</b> Every item was approved. The bank preparation is the next phase and is not available yet.</div>`
      : c.status === 'Live' ? `<div class="info ok"><b>Live${c.liveSince ? ' since ' + esc(c.liveSince) : ''}.</b> This service is now worked from the Merchant module.</div>` : '';
    if (nested) {
      const what = c.changes.map(x => x.label).join(', ');
      return `<div class="sub" data-part="${esc(c.id)}"><div class="ptitle"><h3>${esc(what)}</h3>${sc(c.status)}<span style="font-size:13px;color:var(--cadet-base)">${esc(c.caseId)}${open ? ' · ' + p.list.filter(x => x.state !== 'todo').length + ' of ' + p.total + ' reviewed' : ''}</span></div>${note}<div>${p.list.map(x => row(x, c)).join('')}</div></div>`;
    }
    const rd = U.readiness(c), block = open && !app && p.list.every(x => x.state === 'ok') && rd && !rd.complete ? `<div class="info bad"><b>Every item is approved.</b> Complete the required fields in Bank readiness below to send this case to the bank.</div>` : '';
    return `<section class="card sec" data-part="${esc(c.id)}"><div class="sec-h"><div class="ptitle"><h2>${app ? 'Application details' : esc(c.service)}</h2>${sc(c.status)}<span style="font-size:13px;color:var(--cadet-base)">${esc(c.caseId)}${open ? ' · ' + p.list.filter(x => x.state !== 'todo').length + ' of ' + p.total + ' reviewed' : ''}</span></div>
      <div style="display:flex;gap:8px;align-items:center">${U.PHASE2 && c.status === 'Bank Submission' ? `<button class="btn btn-primary" type="button" data-live="${esc(c.id)}">Mark live</button>` : ''}</div></div>
      ${app ? (c.isNew ? '<p style="margin:0;color:var(--cadet-base)">The application\'s business details and payout method, submitted for the first time. There are no earlier values to compare with.</p>' : '<p style="margin:0;color:var(--cadet-base)">Changes to the business details or payout methods. Nothing is applied until every change is approved.</p>') : ''}
      ${note}${block}<div>${app ? p.list.map(x => row(x, c)).join('') : [['pricing', 'Services & pricing'], ['website', 'Website or social media'], ['documents', 'Documents'], ['contracts', 'Contract']].map(([t, h]) => { const xs = p.list.filter(x => x.tab === t); const n = xs.reduce((k, x) => k + (x.list ? x.list.length : 0), 0); return xs.length ? `<div class="sgrp"><div class="gh"><h3>${h}${xs.reduce((k, x) => k + (x.links ? x.links.length : 0), 0) > 1 ? ' \u00b7 ' + xs.reduce((k, x) => k + (x.links ? x.links.length : 0), 0) + ' links' : ''}</h3>${n ? `<button class="btn btn-outline btn-sm" type="button" data-dlall="${esc(c.id)}" data-sec="${t}">${icon('download', 'ic')}Download all (${n})</button>` : ''}</div>${xs.map(x => row(x, c)).join('')}</div>` : ''; }).join('')}</div></section>`;
  }
  /* The data the banks need, by who supplies it. A case cannot go to the bank until every required field is complete. */
  function readinessCard(c) {
    const r = U.readiness(c); if (!r) return '';
    const input = f => {
      const id = 'bf-' + f.k, cls = 'inp' + (f.required && !f.done ? ' bad' : '');
      const ctl = !f.editable ? `<div class="bv">${f.value ? esc(f.value) : '<span style="color:var(--cadet-base)">' + (f.auto ? 'Not available' : 'Not set') + '</span>'}</div>`
        : f.type === 'select' ? `<select class="sel" id="${id}" data-bf="${f.k}"><option value="">Select</option>${f.options.map(o => `<option ${o === f.value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : `<input class="${cls}" id="${id}" data-bf="${f.k}" value="${esc(f.value)}">`;
      return `<div class="fld${f.wide ? ' wide' : ''}"><label for="${id}">${esc(f.label)}${f.required ? '' : ' <span class="opt">(optional)</span>'}${f.auto ? ' <span class="tag">Auto</span>' : ''}</label>${ctl}</div>`;
    };
    const block = g => g.fields.length ? `<div class="rg"><h3>${esc(g.title)}</h3><p>${esc(g.note)}</p><div class="fgrid">${g.fields.map(input).join('')}</div></div>` : '';
    return `<section class="card sec"><div class="sec-h"><div class="ptitle"><h2>Bank readiness</h2><span class="sc ${r.complete ? 'ok' : 'warn'}">${r.complete ? 'Complete' : r.done + ' of ' + r.total + ' required'}</span></div></div>
      <p style="margin:0;color:var(--cadet-base)">${r.complete ? 'Everything the banks need for this service is in place.' : 'The case cannot be sent to the bank until every required field is complete. Missing: ' + esc(r.missing.join(', ')) + '.'}</p>
      ${r.groups.filter(g => g.key !== 'bank' || r.sent).map(block).join('')}</section>`;
  }
  /* An application can have both kinds of case: a change to the merchant's details and requested services. They stay separate cases;
     this only links to the other kind on the same application. */
  function relatedCard(c) {
    const list = U.related(c); if (!list.length) return '';
    const app = c.type === 'application';
    return `<section class="card sec"><div class="sec-h"><div class="tt"><h2>${app ? 'Services requested on this application' : 'Details changes on this application'}</h2><p>${app ? 'Each service is its own case.' : 'Changes to the business details or payout methods are their own cases.'}</p></div></div><div>${list.map(r => `<div class="row"><div class="i"><span class="n">${esc(r.type === 'application' ? r.changes.map(x => x.label).join(', ') : r.service)}</span><span class="f">${esc(r.caseId)} · ${r.type === 'application' ? 'Application details' : 'Service case'}</span></div><div class="a">${sc(r.status)}<a class="btn btn-outline btn-sm" href="sales-case.html?id=${encodeURIComponent(r.id)}">Open</a></div></div>`).join('')}</div></section>`;
  }
  /* The two phases of a service case. Phase 1 is the review below; phase 2, the bank preparation, comes later. */
  function phases(c, p) {
    const done = p.list.filter(x => x.state !== 'todo').length;
    const one = c.status === 'Underwriting Review' ? ['now', done + ' of ' + p.total + ' items reviewed'] : c.status === 'Rejected' ? ['bad', 'Rejected and returned to Sales'] : ['done', 'Complete'];
    const two = U.PHASE2 ? [c.status === 'Bank Submission' ? 'now' : c.status === 'Live' ? 'done' : 'later', c.status === 'Bank Submission' ? 'In progress' : c.status === 'Live' ? 'Complete' : 'Starts after the review'] : ['later', 'Coming later'];
    return `<ol class="phases" aria-label="Case phases"><li class="${one[0]}"><span class="d">${one[0] === 'done' ? icon('check', 'ic-14') : '1'}</span><div><b>Case review</b><span class="s">Case info, the service with its documents and contract</span><em>${esc(one[1])}</em></div></li>
      <li class="${two[0]}"><span class="d">2</span><div><b>Bank preparation</b><span class="s">The data and steps to send the case to the bank</span><em>${esc(two[1])}</em></div></li></ol>`;
  }
  function logsDrawer(c) {
    SA.drawer({ title: 'Activity logs', sub: esc(c.merchant.name) + ' · ' + esc(c.caseId), render(api) {
      const ev = U.activity(c);
      api.body.innerHTML = ev.length ? `<ul class="log">${ev.map(e => `<li><span class="li">${icon(e.ic || 'pencil', 'ic-16')}</span><div><div class="t num">${esc(e.t)}</div><div><b>${esc(e.who)}</b> ${esc(e.text)}</div>${e.detail ? `<div class="d">${esc(e.detail)}</div>` : ''}</div></li>`).join('')}</ul>` : '<p class="hint">No activity yet.</p>';
    } });
  }

  function render() {
    const c = U.get(id), page = document.getElementById('page');
    if (!c) { page.innerHTML = `<div class="wrap"><div class="card empty"><h3>Case not found</h3><p class="hint">It may be assigned to another agent, or the sales application was reset.</p><a class="btn btn-outline" href="cases.html">Back to Cases</a></div></div>`; return; }
    document.title = 'Kashier | ' + c.caseId;
    const mgr = me.canReassign, app = c.type === 'application';
    // A case is one thing: one service (method) with its pricing, documents and contract, or one change request to the merchant's details.
    // The application as a whole is not handled here; the case only points back to it.
    const parts = [c];
    const notes = c.local.notes;
    const info = [['Business', { html: `${esc(c.merchant.name)}<span class="mid" title="Account MID">${esc(c.mid)}</span>` }], ['Contact', c.merchant.email + ' · ' + c.merchant.phone], ['Industry', c.industry + ' · ' + c.entity],  ['Application', c.appId + ' · submitted by ' + c.submittedBy + (c.submittedAt ? ' on ' + c.submittedAt : '')]]
      .concat(mgr ? [] : [['Assigned to', c.assignee]]).concat(c.sla ? [['Time in stage', U.wait(c.hours) + (c.late ? ' · Late' : '') + ' (target ' + c.sla / 24 + ' days)']] : []);
    page.innerHTML = `<div class="wrap">
      <header class="hdr"><div>${crumb(c.caseId)}<h1>${app ? `${esc(c.merchant.name)}<span class="mid" title="Account MID">${esc(c.mid)}</span>` : esc(c.service)}</h1>
        <div class="meta"><span class="tag">${app ? (c.isNew ? 'Application details \u00b7 new' : 'Application details \u00b7 change') : 'Service case'}</span>${app ? '' : `<span><b>${esc(c.merchant.name)}</b><span class="mid" title="Account MID">${esc(c.mid)}</span></span>`}<span>${esc(c.appId)}</span><button type="button" class="linkb" data-logs>View logs</button></div></div>${profile}</header>
      ${app || !U.PHASE2 ? '' : phases(c, U.progress(c))}
      <section class="card sec"><div class="sec-h"><div class="tt"><h2>Case info</h2></div></div>${dl(info)}
        ${mgr ? `<div class="fld" style="max-width:280px"><label for="assignSel">Assigned to</label><select class="sel" id="assignSel">${C.TEAM.map(n => `<option ${n === c.assignee ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}</section>
      ${parts.map(x => part(x)).join('')}
      ${relatedCard(c)}
      ${app ? '' : readinessCard(c)}
      <section class="card sec"><div class="sec-h"><div class="tt"><h2>Internal notes</h2><p>Seen by Underwriting only, never by Sales.</p></div></div>
        <div class="fld"><textarea class="inp" id="noteTx" rows="2" placeholder="Add a note"></textarea></div><button class="btn btn-outline btn-sm" type="button" data-note style="align-self:flex-start">Add note</button>
        ${notes.map(n => `<div class="note"><div class="k">${esc(n.by)} · ${esc(C.fmtDate(n.ts))}</div><div>${esc(n.text)}</div></div>`).join('')}</section></div>`;
    bind(c);
  }

  /* The prototype keeps file names only, so a download is a small placeholder file under the real name. */
  function saveText(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  function save(name) { saveText(name, 'Prototype placeholder for ' + name + '. The prototype does not store real files.\n'); SA.toast('Downloading ' + name); }
  function flagModal(cid, key, label) {
    SA.modal({ title: 'Reject this item?', sub: esc(label), body: '<div class="fld"><label for="flC">Decision comment</label><textarea class="inp" id="flC" rows="2" placeholder="What does Sales need to fix?"></textarea></div>',
      foot: '<button type="button" class="btn btn-outline" data-n>Cancel</button><button type="button" class="btn btn-danger" data-y disabled>Reject</button>',
      bind(api) {
        const t = api.el.querySelector('#flC'), y = api.el.querySelector('[data-y]');
        t.oninput = () => { y.disabled = !t.value.trim(); }; api.el.querySelector('[data-n]').onclick = api.close;
        y.onclick = () => { U.setReview(U.get(cid), key, 'flag', t.value.trim()); api.close(); decided(cid); };
      } });
  }
  /* After each decision: once every item of a case is decided, that case settles itself. */
  function decided(cid) {
    const before = U.get(cid), r = U.settle(cid), c = U.get(cid) || before, no = c ? c.caseId : 'Case', app = c && c.type === 'application';
    if (!r) return render();
    if (r === 'blocked') { render(); SA.toast('Approved. Complete the bank readiness fields to send it to the bank.'); return; }
    const msg = r === 'rejected' ? no + ' rejected and returned to Sales' : no + (app ? (c && c.isNew ? ' approved. The submitted details are confirmed.' : ' approved. The changes are applied.') : ' review complete. Moved to Bank Submission.');
    if (cid === id) go(msg); else { render(); SA.toast(msg); }
  }
  function bind(c) {
    const q = s => document.querySelectorAll(s), one = s => document.querySelector(s);
    q('[data-ok]').forEach(b => b.onclick = () => { U.setReview(U.get(b.dataset.case), b.dataset.ok, 'ok'); decided(b.dataset.case); });
    q('[data-clear]').forEach(b => b.onclick = () => { U.setReview(U.get(b.dataset.case), b.dataset.clear, 'todo'); render(); });
    q('[data-flag]').forEach(b => b.onclick = () => flagModal(b.dataset.case, b.dataset.flag, b.dataset.lbl));
    q('[data-logs]').forEach(b => b.onclick = () => logsDrawer(c));
    q('[data-bf]').forEach(e => e.onchange = () => { U.setField(c, e.dataset.bf, e.value); const r = U.settle(c.id); if (r === 'approved' || r === 'rejected') go(c.caseId + (r === 'approved' ? ' approved and sent to the bank' : ' rejected and returned to Sales')); else render(); });
    q('[data-view]').forEach(b => b.onclick = () => SA.drawer({ size: 'xl', title: esc(b.dataset.l), sub: esc(b.dataset.view), render(api) { api.body.innerHTML = `<div class="fprev fprev-lg">${icon('doc', 'ic-24')}<b>${esc(b.dataset.view)}</b><span class="hint">Preview of the uploaded file. The prototype does not store real files.</span></div>`; api.foot.innerHTML = `<span class="sp"></span><button type="button" class="btn btn-outline" data-dl-d="${esc(b.dataset.view)}">${icon('download', 'ic')}Download</button>`; api.foot.querySelector('[data-dl-d]').onclick = () => save(b.dataset.view); } }));
    q('[data-dl]').forEach(b => b.onclick = () => save(b.dataset.dl));
    q('[data-dlall]').forEach(b => b.onclick = () => { const cc = U.get(b.dataset.dlall), sec = b.dataset.sec, nm = sec === 'contracts' ? 'contracts' : 'documents', names = [].concat.apply([], U.progress(cc).list.filter(x => x.tab === sec).map(x => x.list || [])); saveText(cc.caseId + '-' + nm + '.txt', 'The ' + nm + ' uploaded for ' + cc.caseId + ' (' + cc.merchant.name + ')\n\n' + names.join('\n') + '\n'); SA.toast('Downloading ' + names.length + ' ' + nm.slice(0, -1) + (names.length === 1 ? '' : 's')); });
    q('[data-live]').forEach(b => b.onclick = () => { U.goLive(U.get(b.dataset.live)); render(); SA.toast('Marked live'); });
    const s = one('#assignSel'); if (s) s.onchange = () => { U.assign(c, s.value); SA.toast('Reassigned to ' + s.value); render(); };
    const n = one('[data-note]'); if (n) n.onclick = () => { const t = one('#noteTx').value.trim(); if (t) { U.addNote(c, t); render(); } };
  }
  const USERS = { agent: 'Rana Adel · Agent', agent2: 'Omar Hassan · Agent', agent3: 'Salma Nabil · Agent', manager: 'Layla Samir · Manager' };
  SA.mount({ key: 'case', render,
    protoControls: () => `<label class="lbl" for="role">View as</label><select id="role">${Object.keys(USERS).map(k => `<option value="${k}" ${me.key === k ? 'selected' : ''}>${USERS[k]}</option>`).join('')}</select>`,
    bindProto() { document.getElementById('role').onchange = e => { try { localStorage.setItem('kashierCasesUser', e.target.value); } catch (x) { /* storage unavailable */ } location.reload(); }; } });
})();
</script>
</body>
</html>
